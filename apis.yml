aid: aiflow
name: aiFlow
description: >-
  aiFlow (AiFlow, Inc., Y Combinator W23) is a San Francisco company building AI-powered executive
  intelligence for private equity talent teams and executive search firms, founded in 2022 by Nick
  Manske and Josh Gardner. Its platform reads public sources — company sites, press, deal
  announcements and professional profiles — to generate data-driven evaluations of C-level and board
  candidates, revenue estimates with published comparable-company methodology, transaction and funding
  history, backchannel and reference discovery, and search management. In 2025 the founders relaunched
  the product as Verata, Inc. at veratainsight.com; the aiFlow brand site and the company's Auth0
  identity tenant at auth.aiflow.solutions both remain live and the Verata application authenticates
  against them. aiFlow publishes no developer program, no API documentation and no machine-readable
  API contract — its security page states the platform is self-contained by design with no
  third-party ATS or CRM integrations — so the only machine-readable documents it serves are the
  OpenID Connect and OAuth 2.0 authorization-server discovery documents that gate its own application.
